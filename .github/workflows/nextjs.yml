# CI workflow for Turborepo + pnpm + Next.js
# - Uses pnpm workspace with Turborepo pipelines
# - Caches dependencies and Next.js build cache
# - Runs lint, typecheck, and build for apps/web
# - Includes optional Turborepo remote cache via secrets

name: CI (Turborepo + pnpm + Next.js)

on:
  push:
    branches: ["main"]
  pull_request:

# Minimal permissions for CI
permissions:
  contents: read

# Cancel previous runs for the same branch/PR to save CI time
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Disable Next telemetry during CI
      NEXT_TELEMETRY_DISABLED: 1
      # Optional Turborepo remote cache (configure in repo Settings → Secrets)
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match repo packageManager version for reliability
          version: "10.4.1"
          run_install: false

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Show workspace info
        run: |
          pnpm -v
          node -v
          pnpm list -r --depth 0

      # Restore Next.js build cache to speed up subsequent builds
      - name: Restore Next.js cache (apps/web)
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx', 'apps/web/**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Lint (Turborepo)
        run: pnpm turbo run lint

      - name: Typecheck (Turborepo)
        run: pnpm turbo run typecheck

      # Build only the web app; Turborepo will honor pipeline dependencies
      - name: Build web (Next.js via Turborepo)
        run: pnpm turbo run build --filter=./apps/web


      - name: "Smoke check: Next.js output exists"
        run: |
          if [ -d "apps/web/.next" ]; then
            echo "Next.js build output found";
          else
            echo "::error::Next.js build output missing";
            exit 1;
          fi

      # Upload build artifacts for debugging or downstream jobs (optional)
      - name: Upload web .next artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-next-output
          path: apps/web/.next
          if-no-files-found: error
          retention-days: 7

      # Failure summary for quick visibility
      - name: Failure summary
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('CI failed: See logs for details.');
            core.summary.addHeading('CI Failure (Turborepo + pnpm)');
            core.summary.addRaw('One or more steps failed. Review lint/typecheck/build logs.');
            await core.summary.write();
