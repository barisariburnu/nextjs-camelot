# Deploy Next.js static export to GitHub Pages
name: Deploy (GitHub Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      # Enable static export with basePath for repo pages
      NEXT_EXPORT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.4.1"
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm turbo run lint
          pnpm turbo run typecheck --filter=web

      - name: Build static site (apps/web)
        run: pnpm -w turbo run build --filter=web

      - name: Verify static export
        run: |
          if [ -d "apps/web/out" ]; then
            echo "Static export produced at apps/web/out";
          else
            echo "::error::Static export missing (apps/web/out)";
            ls -la apps/web || true
            exit 1;
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4